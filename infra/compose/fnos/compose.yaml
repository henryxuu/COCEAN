name: ${COMPOSE_PROJECT_NAME:-cocean}

x-app-common: &app-common
  restart: unless-stopped
  init: true
  user: "${PUID:-1000}:${PGID:-1000}"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=128m,mode=1777
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-app-build: &app-build
  context: ../../..
  dockerfile: infra/docker/Dockerfile.node-runtime

services:
  web:
    <<: *app-common
    mem_limit: "${COCEAN_WEB_MEMORY_LIMIT:-256m}"
    image: "${COCEAN_REGISTRY:-ghcr.io}/${COCEAN_IMAGE_NAMESPACE:-cocean-project}/web:${COCEAN_VERSION:-edge}"
    build:
      <<: *app-build
      args:
        COCEAN_APP: web
        DEBIAN_MIRROR: "${DEBIAN_MIRROR:-}"
        NODE_IMAGE: "${NODE_IMAGE:-node:22.22.0-bookworm-slim}"
        PNPM_VERSION: "${PNPM_VERSION:-11.0.0}"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      COCEAN_SERVER_URL: http://server:8080
      HOME: /tmp
      XDG_CACHE_HOME: /tmp
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${COCEAN_HTTP_BIND:-0.0.0.0}:${COCEAN_HTTP_PORT:-18080}:3000"
    networks:
      - edge
      - backend
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.mjs"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  server:
    <<: *app-common
    mem_limit: "${COCEAN_SERVER_MEMORY_LIMIT:-768m}"
    image: "${COCEAN_REGISTRY:-ghcr.io}/${COCEAN_IMAGE_NAMESPACE:-cocean-project}/server:${COCEAN_VERSION:-edge}"
    build:
      <<: *app-build
      args:
        COCEAN_APP: server
        DEBIAN_MIRROR: "${DEBIAN_MIRROR:-}"
        NODE_IMAGE: "${NODE_IMAGE:-node:22.22.0-bookworm-slim}"
        PNPM_VERSION: "${PNPM_VERSION:-11.0.0}"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      NODE_ENV: production
      COCEAN_PORT: "8080"
      COCEAN_HOST: 0.0.0.0
      COCEAN_DATABASE_PATH: /var/lib/cocean/cocean.sqlite
      COCEAN_CACHE_ROOT: /var/cache/cocean
      COCEAN_MUSIC_ROOT: /library/music
      COCEAN_MUSIC_ROOT_POLICY: "${COCEAN_MUSIC_ROOT_POLICY:-WATCH_ONLY}"
      COCEAN_QUARANTINE_ROOT: /library/quarantine
      COCEAN_STILL_CATALOG_PATH: /var/lib/cocean/still-catalog.json
      COCEAN_AUTH_BOOTSTRAP_FILE: /run/secrets/cocean_owner_bootstrap
      COCEAN_CREDENTIAL_KEY_PATH: /var/lib/cocean/credential.key
      COCEAN_SESSION_TTL_HOURS: "${COCEAN_SESSION_TTL_HOURS:-720}"
      COCEAN_COOKIE_SECURE: "${COCEAN_COOKIE_SECURE:-false}"
      COCEAN_FFMPEG_PATH: /usr/bin/ffmpeg
      COCEAN_APPLE_LOOKUP_ENABLED: "${COCEAN_APPLE_LOOKUP_ENABLED:-true}"
      COCEAN_EXTERNAL_LOOKUP_TIMEOUT_MS: "${COCEAN_EXTERNAL_LOOKUP_TIMEOUT_MS:-8000}"
      COCEAN_DEMO_DATA: "false"
      COCEAN_MUSICBRAINZ_ENABLED: "${COCEAN_MUSICBRAINZ_ENABLED:-false}"
      COCEAN_METADATA_CONTACT: "${COCEAN_METADATA_CONTACT:-}"
      COCEAN_LOG_LEVEL: "${COCEAN_LOG_LEVEL:-info}"
      HOME: /tmp
      XDG_CACHE_HOME: /var/cache/cocean
    expose:
      - "8080"
    secrets:
      - cocean_owner_bootstrap
    volumes:
      - type: bind
        source: "${COCEAN_DATA_DIR:?set COCEAN_DATA_DIR in .env}"
        target: /var/lib/cocean
        bind:
          create_host_path: false
      - type: bind
        source: "${COCEAN_CACHE_DIR:?set COCEAN_CACHE_DIR in .env}"
        target: /var/cache/cocean
        bind:
          create_host_path: false
      - type: bind
        source: "${COCEAN_MUSIC_DIR:?set COCEAN_MUSIC_DIR in .env}"
        target: /library/music
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${COCEAN_DELIVERY_DIR:?set COCEAN_DELIVERY_DIR in .env}"
        target: /delivery/usb
        bind:
          create_host_path: false
    networks:
      - backend
      - egress
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ "$${COCEAN_MUSICBRAINZ_ENABLED}" = "true" ] && [ -z "$${COCEAN_METADATA_CONTACT}" ];
          then exit 1; fi;
          exec node /app/healthcheck.mjs
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *app-common
    # Includes reclaimable file page cache generated by full-library hashing.
    # A bounded cgroup keeps first scans from consuming the NAS-wide cache.
    mem_limit: "${COCEAN_WORKER_MEMORY_LIMIT:-2g}"
    image: "${COCEAN_REGISTRY:-ghcr.io}/${COCEAN_IMAGE_NAMESPACE:-cocean-project}/worker:${COCEAN_VERSION:-edge}"
    build:
      <<: *app-build
      args:
        COCEAN_APP: worker
        DEBIAN_MIRROR: "${DEBIAN_MIRROR:-}"
        NODE_IMAGE: "${NODE_IMAGE:-node:22.22.0-bookworm-slim}"
        PNPM_VERSION: "${PNPM_VERSION:-11.0.0}"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      NODE_ENV: production
      COCEAN_DATABASE_PATH: /var/lib/cocean/cocean.sqlite
      COCEAN_CACHE_ROOT: /var/cache/cocean
      COCEAN_MUSIC_ROOT: /library/music
      COCEAN_MUSIC_ROOT_POLICY: "${COCEAN_MUSIC_ROOT_POLICY:-WATCH_ONLY}"
      COCEAN_QUARANTINE_ROOT: /library/quarantine
      COCEAN_WORKER_POLL_MS: "${COCEAN_WORKER_POLL_MS:-1500}"
      COCEAN_WORKER_ONCE: "false"
      COCEAN_FFPROBE_PATH: "${COCEAN_FFPROBE_PATH:-/usr/bin/ffprobe}"
      COCEAN_FFPROBE_TIMEOUT_MS: "${COCEAN_FFPROBE_TIMEOUT_MS:-30000}"
      COCEAN_SCAN_EXCLUDE_DIRS: "${COCEAN_SCAN_EXCLUDE_DIRS:-[]}"
      COCEAN_LOG_LEVEL: "${COCEAN_LOG_LEVEL:-info}"
      HOME: /tmp
      XDG_CACHE_HOME: /var/cache/cocean
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - type: bind
        source: "${COCEAN_DATA_DIR:?set COCEAN_DATA_DIR in .env}"
        target: /var/lib/cocean
        bind:
          create_host_path: false
      - type: bind
        source: "${COCEAN_CACHE_DIR:?set COCEAN_CACHE_DIR in .env}"
        target: /var/cache/cocean
        bind:
          create_host_path: false
      - type: bind
        source: "${COCEAN_MUSIC_DIR:?set COCEAN_MUSIC_DIR in .env}"
        target: /library/music
        read_only: "${COCEAN_MUSIC_READ_ONLY:-true}"
        bind:
          create_host_path: false
      - type: bind
        source: "${COCEAN_QUARANTINE_DIR:?set COCEAN_QUARANTINE_DIR in .env}"
        target: /library/quarantine
        bind:
          create_host_path: false
      - type: bind
        source: "${COCEAN_INBOX_DIR:?set COCEAN_INBOX_DIR in .env}"
        target: /library/inbox
        bind:
          create_host_path: false
    networks:
      - backend
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.mjs"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s

  provider-qobuz:
    <<: *app-common
    profiles:
      - providers
    scale: 0
    restart: "no"
    image: "${COCEAN_REGISTRY:-ghcr.io}/${COCEAN_IMAGE_NAMESPACE:-cocean-project}/worker:${COCEAN_VERSION:-edge}"
    command: ["node", "/app/provider.mjs"]
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      NODE_ENV: production
      COCEAN_PROVIDER_DISABLED: "true"
      HOME: /tmp
      XDG_CACHE_HOME: /tmp
    network_mode: none
    healthcheck:
      test: ["CMD", "node", "/app/provider-healthcheck.mjs"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  music-manifest:
    profiles:
      - acceptance
    image: "${PYTHON_IMAGE:-python:3.13-alpine}"
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    entrypoint: ["python3", "/opt/cocean/music_manifest.py"]
    environment:
      COCEAN_SCAN_EXCLUDE_DIRS: "${COCEAN_SCAN_EXCLUDE_DIRS:-[]}"
    volumes:
      - type: bind
        source: ../../scripts/music_manifest.py
        target: /opt/cocean/music_manifest.py
        read_only: true
      - type: bind
        source: "${COCEAN_MUSIC_DIR:?set COCEAN_MUSIC_DIR in .env}"
        target: /library/music
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${COCEAN_DATA_DIR:?set COCEAN_DATA_DIR in .env}"
        target: /var/lib/cocean
        bind:
          create_host_path: false
    network_mode: none

  acceptance-api:
    profiles:
      - acceptance
    image: "${PYTHON_IMAGE:-python:3.13-alpine}"
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: "no"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
    entrypoint: ["python3", "/opt/cocean/fnos_api_acceptance.py"]
    environment:
      COCEAN_ACCEPTANCE_BASE_URL: http://server:8080
      COCEAN_ACCEPTANCE_REPORT: /var/lib/cocean/acceptance/api-report.json
      COCEAN_ACCEPTANCE_MANIFEST: /var/lib/cocean/acceptance/music-before.jsonl
      COCEAN_ACCEPTANCE_MANIFEST_HASH: "${COCEAN_ACCEPTANCE_MANIFEST_HASH:-sha256}"
      COCEAN_SCAN_EXCLUDE_DIRS: "${COCEAN_SCAN_EXCLUDE_DIRS:-[]}"
      COCEAN_ACCEPTANCE_EXISTING_SCAN_ID: "${COCEAN_ACCEPTANCE_EXISTING_SCAN_ID:-}"
      COCEAN_ACCEPTANCE_ALLOWED_UNSUPPORTED_EXTENSIONS: "${COCEAN_ACCEPTANCE_ALLOWED_UNSUPPORTED_EXTENSIONS:-}"
      COCEAN_ACCEPTANCE_REQUEST_TIMEOUT: "${COCEAN_ACCEPTANCE_REQUEST_TIMEOUT:-15}"
      COCEAN_ACCEPTANCE_SCAN_TIMEOUT: "${COCEAN_ACCEPTANCE_SCAN_TIMEOUT:-7200}"
      COCEAN_ACCEPTANCE_POLL_INTERVAL: "${COCEAN_ACCEPTANCE_POLL_INTERVAL:-2}"
      COCEAN_ACCEPTANCE_MAX_FAILURES: "${COCEAN_ACCEPTANCE_MAX_FAILURES:-0}"
      COCEAN_ACCEPTANCE_MIN_ALBUMS: "${COCEAN_ACCEPTANCE_MIN_ALBUMS:-1}"
      COCEAN_ACCEPTANCE_MIN_ARTWORKS: "${COCEAN_ACCEPTANCE_MIN_ARTWORKS:-1}"
      COCEAN_ACCEPTANCE_MAX_MISSING_ARTWORKS: "${COCEAN_ACCEPTANCE_MAX_MISSING_ARTWORKS:-0}"
      COCEAN_ACCEPTANCE_MAX_ALBUM_ISSUES: "${COCEAN_ACCEPTANCE_MAX_ALBUM_ISSUES:-0}"
      COCEAN_ACCEPTANCE_MAX_IGNORED_FILES: "${COCEAN_ACCEPTANCE_MAX_IGNORED_FILES:-0}"
      COCEAN_ACCEPTANCE_MAX_SKIPPED_SYMLINKS: "${COCEAN_ACCEPTANCE_MAX_SKIPPED_SYMLINKS:-0}"
      COCEAN_ACCEPTANCE_MAX_CUE_FILES: "${COCEAN_ACCEPTANCE_MAX_CUE_FILES:-0}"
      COCEAN_ACCEPTANCE_MAX_OTHER_ENTRIES: "${COCEAN_ACCEPTANCE_MAX_OTHER_ENTRIES:-0}"
      COCEAN_ACCEPTANCE_MAX_TAG_WARNINGS: "${COCEAN_ACCEPTANCE_MAX_TAG_WARNINGS:-0}"
      COCEAN_ACCEPTANCE_MAX_TECHNICAL_WARNINGS: "${COCEAN_ACCEPTANCE_MAX_TECHNICAL_WARNINGS:-0}"
      COCEAN_ACCEPTANCE_LISTEN_MODE: "${COCEAN_ACCEPTANCE_LISTEN_MODE:-each-track}"
    depends_on:
      web:
        condition: service_healthy
      worker:
        condition: service_healthy
    volumes:
      - type: bind
        source: ../../scripts/fnos_api_acceptance.py
        target: /opt/cocean/fnos_api_acceptance.py
        read_only: true
      - type: bind
        source: "${COCEAN_DATA_DIR:?set COCEAN_DATA_DIR in .env}"
        target: /var/lib/cocean
        bind:
          create_host_path: false
    networks:
      - backend

  db-maintenance:
    profiles:
      - maintenance
    image: "${COCEAN_REGISTRY:-ghcr.io}/${COCEAN_IMAGE_NAMESPACE:-cocean-project}/server:${COCEAN_VERSION:-edge}"
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
    entrypoint: ["node", "/app/backup.mjs"]
    environment:
      NODE_ENV: production
      COCEAN_VERSION: "${COCEAN_VERSION:?set COCEAN_VERSION in .env}"
      COCEAN_DATABASE_PATH: /var/lib/cocean/cocean.sqlite
      HOME: /tmp
    volumes:
      - type: bind
        source: "${COCEAN_DATA_DIR:?set COCEAN_DATA_DIR in .env}"
        target: /var/lib/cocean
        bind:
          create_host_path: false
    network_mode: none

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  egress:
    driver: bridge

secrets:
  cocean_owner_bootstrap:
    file: "${COCEAN_WEB_AUTH_FILE:?set COCEAN_WEB_AUTH_FILE in .env}"
