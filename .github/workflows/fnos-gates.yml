name: FNOS deployment gates

on:
  pull_request:
    paths:
      - "infra/**"
      - "docs/deployment/**"
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/fnos-gates.yml"
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - "docs/deployment/**"
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/fnos-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install media tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - name: Install locked workspace
        run: pnpm install --frozen-lockfile
      - name: Typecheck, unit test and build every package
        run: pnpm check
      - name: Generate and scan real audio fixtures
        run: pnpm --filter @cocean/media-scanner test:integration

  static-and-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run FNOS static and mock gates
        run: sh infra/tests/run.sh

  compose-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Record Docker and Compose versions
        run: |
          docker version
          docker compose version
      - name: Render all FNOS profiles with Docker Compose
        run: |
          docker compose --env-file infra/compose/fnos/.env.example -f infra/compose/fnos/compose.yaml config --quiet
          docker compose --env-file infra/compose/fnos/.env.example -f infra/compose/fnos/compose.yaml --profile acceptance config --quiet
          docker compose --env-file infra/compose/fnos/.env.example -f infra/compose/fnos/compose.yaml --profile maintenance config --quiet
          docker compose --env-file infra/compose/fnos/.env.example -f infra/compose/fnos/compose.yaml --profile providers config --quiet
      - name: Validate multi-architecture Bake plan
        run: sh infra/scripts/buildx.sh --print >/dev/null

  container-build:
    needs:
      - application
      - compose-contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build the arm64 runtime images
        run: >-
          docker buildx bake --file infra/build/docker-bake.hcl
          --set "*.platform=linux/arm64"
          --set "*.output=type=cacheonly"
      - name: Build and load the amd64 runtime images
        env:
          COCEAN_PLATFORMS: linux/amd64
        run: sh infra/scripts/buildx.sh --load
      - name: Smoke native modules and media tooling
        run: |
          test "$(docker image inspect --format '{{.Architecture}}' ghcr.io/cocean-project/worker:edge)" = amd64
          docker run --rm --entrypoint node ghcr.io/cocean-project/worker:edge -e 'const Database=(await import("better-sqlite3")).default; const db=new Database(":memory:"); db.prepare("SELECT 1").get(); db.close()'
          docker run --rm --entrypoint /usr/bin/ffprobe ghcr.io/cocean-project/worker:edge -version
